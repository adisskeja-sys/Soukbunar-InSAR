<style>
  :root { --bg:#fff; --fg:#17212b; --mut:#5b6672; --line:#d5dae0; --bar:#16324a; --barfg:#fff; --acc:#1f6fb2; }

  :root[data-theme="dark"] { --bg:#141a21; --fg:#e8edf2; --mut:#9aa6b2; --line:#2c3642; --bar:#0e1f2e; --acc:#6bb3ee; }
  * { box-sizing:border-box; }

         width:300px; max-width:calc(100vw - 72px); max-height:calc(100vh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow:auto; }

  #leg.min .bd { display:none; }
  #leg .kl { display:flex; align-items:flex-start; gap:7px; margin:4px 0; }
  #leg .kl.k4 { display:inline-flex; width:48%; margin:2px 0; }
  #leg i { flex:none; display:inline-block; width:12px; height:12px; border-radius:50%; margin-top:2px; border:1px solid rgba(0,0,0,.45); }
  #leg .mut { color:#5b6672; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:1100; background:var(--bg); border-top:1px solid var(--line); border-radius:14px 14px 0 0; box-shadow:0 -3px 14px rgba(0,0,0,.3);
           padding:10px 14px calc(12px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .22s; max-height:62vh; overflow:auto; }
  #sheet.on { transform:none; }
  #sheet h2 { font-size:16px; margin:0 44px 2px 0; }
  #x { position:absolute; right:8px; top:6px; width:44px; height:44px; border:0; background:none; color:var(--fg); font-size:26px; }
  .row { display:flex; gap:8px; margin:8px 0; }
  .st { flex:1; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }

  .st b { font-size:16px; font-variant-numeric:tabular-nums; }
  .mut { color:var(--mut); font-size:12.5px; }
  #cw { position:relative; height:210px; }
  #cw3 { position:relative; height:170px; }
  #h3 { margin:10px 0 2px; font-size:13.5px; }
  #skok { color:#9c27b0; font-weight:700; font-size:13px; margin-top:2px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #skok { color:#d27be6; } }
  :root[data-theme="dark"] #skok { color:#d27be6; }
  #msg { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); z-index:1200; background:var(--bar); color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; }
  #seg button { white-space:nowrap; padding:0 4px; }
  .leaflet-bottom { margin-bottom:env(safe-area-inset-bottom); }
  #leg .dis { line-height:1.3; margin-top:5px; font-size:11.5px; }
  @media (max-width:520px) {
    #top b { display:none; } #seg button { font-size:13.5px; }
    #leg { font-size:12px; padding:6px 8px; } #leg .kl em { display:none; }
    #leg .dis { font-size:11px; }
  }
  @media (min-width:900px) { #sheet { left:auto; width:460px; right:12px; bottom:12px; border-radius:14px; border:1px solid var(--line); max-height:80vh; } }
</style>
<style>
  html, body { -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

  #inst { position:fixed; left:10px; right:10px; top:calc(62px + env(safe-area-inset-top)); z-index:1150; background:#fff; color:#17212b; border-radius:12px; box-shadow:0 3px 14px rgba(0,0,0,.35);
          padding:10px 44px 10px 12px; font-size:13.5px; line-height:1.4; max-width:460px; margin:0 auto; }
  #inst b { display:block; margin-bottom:2px; } #inst button.ok { margin-top:8px; border:0; background:#16324a; color:#fff; font:600 14px system-ui, sans-serif; border-radius:8px; padding:8px 14px; }
  #inst .zx { position:absolute; right:4px; top:2px; width:40px; height:40px; border:0; background:none; font-size:24px; color:#5b6672; }

<style>
  .tb { flex:none; width:40px; min-height:40px; border:0; border-radius:9px; background:rgba(255,255,255,.14); color:#fff; font:700 17px system-ui, sans-serif; }
  .tb.on { background:#fff; color:#16324a; }

  #prmsg { position:fixed; left:50%; transform:translateX(-50%); top:calc(62px + env(safe-area-inset-top)); z-index:1150; background:#16324a; color:#fff; padding:7px 12px; border-radius:9px; font-size:13px; }
  .kmlab { background:rgba(255,255,255,.85); border:0; box-shadow:none; padding:0 3px; font:700 11px system-ui, sans-serif; color:#5d3a00; }
  .kmlab:before { display:none; }
  .ikon { font:700 11px system-ui, sans-serif; color:#111; white-space:nowrap; text-shadow:0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .ikon b { display:inline-block; width:10px; height:10px; margin-right:3px; vertical-align:-1px; }
  #csv { margin-top:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:8px; padding:7px 12px; font:600 13px system-ui, sans-serif; }
  .leaflet-control-layers { font-size:13px; } .leaflet-control-layers-expanded { max-height:60vh; overflow:auto; }
</style>
<style>#druga{margin-left:auto;white-space:nowrap;font-size:12.5px;color:var(--barfg);opacity:.85;text-decoration:none;border:1px solid currentColor;border-radius:6px;padding:3px 7px}#druga:hover{opacity:1}</style>

<body>
<div id="top"><b>Zenica</b>
  <div id="seg"><button data-m="asc">Asc</button><button data-m="desc" class="on">Desc</button><button data-m="U">Vertikalno</button><button data-m="E">Istok–zapad</button></div>
  <button class="tb" id="bPr" title="Prosjek koherentnih tačaka (γ ≥ 0,7) u krugu 50 m" aria-label="Prosjek u krugu">◎</button><button class="tb" id="bInfo" title="O podacima" aria-label="O podacima">i</button>
</div>
<div id="map"></div>
<div id="msg">Učitavanje…</div>
<div id="prmsg" hidden>Dodirni kartu: prosjek koherentnih tačaka (γ ≥ 0,7) u krugu 50 m</div>
<div id="info" hidden><div class="box"><button class="zx" aria-label="Zatvori">×</button><div id="infotx"></div></div></div>
<div id="inst" hidden><button class="zx" aria-label="Zatvori">×</button><b>Instaliraj aplikaciju</b><span id="insttx"></span><div><button class="ok" id="instok" hidden>Instaliraj</button></div></div>
<div id="sheet"><button id="x" aria-label="Zatvori">×</button>
  <h2 id="ttl"></h2><div class="mut" id="sub"></div><div id="skok" hidden></div>
  <div class="row"><div class="st"><span>Brzina</span><b id="sv"></b></div><div class="st"><span>Ukupno</span><b id="sd"></b></div><div class="st"><span id="lc">Koherencija</span><b id="sc"></b></div></div>
  <div id="cw"><canvas id="ch"></canvas></div>
  <div id="h3"></div>
  <div id="cw3"><canvas id="ch3"></canvas></div>
  <div class="mut" id="note"></div>
  <button id="csv">Preuzmi seriju (CSV)</button>
</div>
<script>
const $ = id => document.getElementById(id), fmt = (v, n) => { const s = Math.abs(v).toFixed(n == null ? 1 : n); return (+s === 0 ? '' : v > 0 ? '+' : '−') + s; };
const sigT = (X, Y, a, b) => { const m = X.length; if (m < 6) return null; let mx = 0; X.forEach(v => mx += v); mx /= m; let ss = 0, sxx = 0, c1 = 0, pe = null; for (let k = 0; k < m; k++) { const e = Y[k] - (a + b * X[k]); ss += e * e; sxx += (X[k] - mx) * (X[k] - mx); if (pe != null) c1 += e * pe; pe = e; } if (!(ss > 0) || !(sxx > 0)) return null; const ro = Math.max(0, Math.min(0.9, c1 / ss)); return Math.sqrt(ss / (m - 2) / sxx * (1 + ro) / (1 - ro)); };   // 1σ nagiba; AR(1) korekcija za vremenski korelisan šum
const med = a => { const q = a.slice().sort((u, v) => u - v), h = q.length >> 1; return q.length % 2 ? q[h] : (q[h - 1] + q[h]) / 2; };
let PLV = new Map(), NEP = new Set(), M, P = {}, TS = {}, V, mode = 'desc', layer, chart, chart3, selM, SKOK = new Map();
const LJ = '#9c27b0', PL = '#1e88e5', cellQ = () => mode === 'U' || mode === 'E';   // PL: plavo = mala prosječna brzina, ali ukupni pomak od 2014 iznad praga   // ljubičasto: tačka je od prethodnog mjerenja prešla u višu klasu brzine (do sljedećeg mjerenja)
const st0 = m => m.options.skok ? { color: '#fff', weight: 1.6 } : m.options.nep ? { color: '#000', weight: 1.5 } : m.options.sb ? { color: '#0d47a1', weight: 1.8 } : { color: '#111', weight: .6 };   // nep: crvena, koherencija 0.3–0.5
const map = L.map('map', { preferCanvas: true, zoomControl: false, zoomSnap: 0.25 });
// poluprečnik tačke prati zumiranje (ćelija 30 m ≈ 15 m poluprečnik), da se na telefonu tačke ne slijepe
const rad = m => { const mpp = 40075016.686 * Math.cos(43.85 * Math.PI / 180) / (256 * Math.pow(2, map.getZoom())); return Math.max(m === 15 ? 3 : 2.2, Math.min(m === 15 ? 9 : 6, m / mpp)); };
map.on('zoomend', () => { if (layer) { const r = rad(mode === 'U' || mode === 'E' ? 15 : 8); layer.eachLayer(l => l.setRadius(l.options.skok ? rLj(r, l.options.puta) : r)); } });
const rLj = (r, n) => r * (1.45 + 0.5 * (Math.min(n || 1, 5) - 1)) + 1;   // ljubičasti krug raste s brojem mjerenja zaredom (do 5)
L.control.zoom({ position: 'bottomright' }).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Esri World Imagery' }).addTo(map);
const lab = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, opacity: .8, attribution: 'Esri' }).addTo(map);
const BAZE = { 'Satelit (Esri)': sat,
  'Karta – OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, attribution: '© OpenStreetMap' }),
  'Topografska – OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 17, attribution: '© OpenStreetMap, SRTM | © OpenTopoMap (CC-BY-SA)' }),
  'Svijetla – CARTO': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution: '© OpenStreetMap © CARTO' }) };
let SBI = new Map(), SB = new Set(), ZK = [], LASTS = null, PROSJEK = false, RPR = 50, krugPr = null;
const uPoligonu = (x, y, p) => { let c = false; for (let a = 0, b = p.length - 1; a < p.length; b = a++) { const [xa, ya] = p[a], [xb, yb] = p[b]; if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) c = !c; } return c; };
function slojevi(S, refC) {
  const P = { pane: 'trasa', interactive: false }, g = (d, st) => L.geoJSON(d, Object.assign({}, P, { style: st }));
  const ik = (ll, html) => L.marker(ll, { icon: L.divIcon({ className: 'ikon', html, iconSize: null, iconAnchor: [5, 6] }), keyboard: false });
  const km = L.geoJSON(S.km, { pointToLayer: (f, ll) => { const s = f.properties.stac_m, c = L.circleMarker(ll, { pane: 'trasa', interactive: false, radius: f.properties.km ? 4 : 2.5, color: '#000', weight: 1, fillColor: '#ff9800', fillOpacity: 1 });
    if (f.properties.km) c.bindTooltip((s > 0 ? '+' : s < 0 ? '−' : '') + Math.abs(s / 1000).toFixed(0) + ' km', { permanent: true, direction: 'right', offset: [4, 0], className: 'kmlab' }); return c; } });
  const a1 = L.layerGroup([g(S.a1, { color: '#fff', weight: 6, opacity: .6 }), g(S.a1, { color: '#ff9800', weight: 2.5, opacity: .95, dashArray: '8 6' }), km]).addTo(map);
  const bos = g(S.bosna, { color: '#4fc3f7', weight: 2.5, opacity: .85 }).addTo(map);
  const vij = g(S.vijadukt, { color: '#ffeb3b', weight: 5, opacity: .9 }).addTo(map);
  const zona = g(S.zona_pehare, { color: '#ffffff', weight: 1.5, dashArray: '4 4', fill: false }).addTo(map);
  const zk0 = g(S.zona_km0 || { type: 'FeatureCollection', features: [] }, { color: '#ffffff', weight: 1.5, dashArray: '4 4', fill: false }).addTo(map);
  const KB = ['#b71c1c', '#e65100', '#f9a825'];
  const zk = L.geoJSON(S.zone_klizanja, Object.assign({}, P, { style: f => ({ color: KB[(f.properties.klasa || 3) - 1] || '#999', weight: 1.5, fillOpacity: .18 }) })).addTo(map);
  ZK = S.zone_klizanja.features.filter(f => f.properties.klasa === 1).flatMap(f => f.geometry.type === 'Polygon' ? [f.geometry.coordinates[0]] : f.geometry.coordinates.map(p => p[0]));
  const kk = L.layerGroup(S.kuce_k.features.map(f => ik([f.geometry.coordinates[1], f.geometry.coordinates[0]], '<b style="background:#d50000;border-radius:2px"></b>K – kuće u klizištu')
    .bindPopup('<b>K – kuće u kliznom dijelu</b><br>Oznaka iz obrade Pehare (D:\\Obilaznica Zenica\\pehare). Pomake vidjeti u ćelijama Vertikalno / Istok–zapad (SBAS).'))).addTo(map);
  const ink = L.layerGroup(S.inklinometri.features.map(f => { const q = f.properties; return ik([f.geometry.coordinates[1], f.geometry.coordinates[0]], '<b style="background:#fff;border:2px solid #000;transform:rotate(45deg)"></b>' + q.naziv)
    .bindPopup('<b>Inklinometar ' + q.naziv + '</b><br>' + (q.nulto ? 'Nulto: ' + q.nulto + '<br>' : '') + (q.zadnje ? 'Zadnje: ' + q.zadnje + '<br>' : '') + (q.H_mm ? 'Horizontalni pomak |H|: ' + q.H_mm + ' mm' + (q.H_mm_god ? ' (' + q.H_mm_god + ' mm/god)' : '') + '<br>' : '') + (q.dubina_m ? 'Dubina: ' + q.dubina_m + ' m' : '')); })).addTo(map);
  L.control.layers(BAZE, { 'Ceste i nazivi (Esri)': lab, 'Autocesta A1 i stacionaža': a1, 'Rijeka Bosna': bos, 'Vijadukt Pehare': vij, 'Zona Pehare (SBAS ćelije)': zona, 'Zona km 0 (SBAS ćelije)': zk0,
    'Zone klizanja Pehare (klase 1–3)': zk, 'Kuće K (klizište)': kk, 'Inklinometri (12)': ink, 'Referentna zona': refC }, { position: 'topright', collapsed: true }).addTo(map);
}
const J = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
const klasa = v => { if (v == null) return -1; const a = Math.abs(v), g = M.granice; let k = 0; while (k < g.length && a >= g[k]) k++; return k; };
const SIVA = '#9e9e9e', boja = v => klasa(v) < 0 ? SIVA : M.boje[klasa(v)];   // siva: premalo dobrih mjerenja u zadnjih 12 mjeseci
const NAZ = { asc: 'Ascending (LOS)', desc: 'Descending (LOS)', U: 'Vertikalno', E: 'Istok–zapad' };
const OPIS = { asc: 'Pomak u pravcu gledanja satelita; − = od satelita.', desc: 'Pomak u pravcu gledanja satelita; − = od satelita.', U: 'Vertikalni pomak ćelije 30 m; − = slijeganje.', E: 'Pomak istok–zapad ćelije 30 m; + = istok. Sjever–jug se ne mjeri.' };
async function init() {
  try { [M, P.asc, P.desc, V] = await Promise.all([J('data/meta.json'), J('data/asc_pts.json'), J('data/desc_pts.json'), J('data/vert.json')]); }
  catch (e) { $('msg').textContent = 'Podaci se ne mogu učitati: ' + e.message; return; }
  const o = M.obuhvat; map.fitBounds([[o.jug, o.zapad], [o.sjever, o.istok]], { padding: [4, 4] });
  if (location.hash === '#soukbunar') map.setView([M.ink.lat + 0.0035, M.ink.lon + 0.004], innerWidth < 600 ? 14.75 : 15.5);   // stari Soukbunar link: zum na klizište
  L.rectangle([[o.jug, o.zapad], [o.sjever, o.istok]], { color: '#fff', weight: 1, fill: false, dashArray: '4 4', interactive: false }).addTo(map);
  const refC = L.circle([M.ref.lat, M.ref.lon], { radius: M.ref.radijus_m, color: '#00e5ff', weight: 1.5, fill: false, dashArray: '6 5' }).addTo(map).bindTooltip('Referentna zona: ' + (M.ref.opis || ''));
  L.marker([M.ink.lat, M.ink.lon]).addTo(map).bindTooltip(M.ink.naziv);
  map.createPane('trasa').style.zIndex = 350;   // ispod tačaka
  fetch('slojevi.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(S => { if (S) slojevi(S, refC); }).catch(() => {});

    (M.kontrole ? '<dt>Kontrole</dt><dd>Referentna zona (medijan trenda, mm/god): prsten r–2r oko zone asc ' + (M.kontrole.asc.prsten ? fmt(M.kontrole.asc.prsten.trend, 2) : '–') + ', desc ' + (M.kontrole.desc.prsten ? fmt(M.kontrole.desc.prsten.trend, 2) : '–') + '; sve koherentne tačke obuhvata asc ' + fmt(M.kontrole.asc.obuhvat.trend, 2) + ', desc ' + fmt(M.kontrole.desc.obuhvat.trend, 2) + '. Brzina u panelu je data s ± 1σ. Retrospektivna provjera (21. 11. 2026): oko polovine ljubičastih signala zadrži pomak u naredna 4 mjerenja; plavi kandidati bez stručnog pregleda su indikacija, ne potvrda.</dd>' : '') + '<dt>Konvencija znaka</dt><dd>LOS > 0 = prema satelitu. Vertikalno: − = slijeganje. Istok–zapad: + = istok. Sjever–jug se ne mjeri (N = 0, ograničenje polarne orbite).</dd>' +
    '<dt>Prikaz</dt><dd>Tačke s koherencijom ≥ 0,5; crvene (> 10 mm/god) s koherencijom 0,3–0,5 i brze tačke (≥ 5 mm/god) niže koherencije u grupi istog smjera (najmanje 5 tačaka u 50 m) prikazane su s crnim rubom kao manje pouzdane. Ćelije 30 m računaju se samo iz tačaka s koherencijom ≥ 0,5.</dd>' +
    '<dt>Boje</dt><dd>Brzina cijelog niza (zeleno < 2, žuto 2–5, narandžasto 5–10, crveno > 10 mm/god). Ljubičasto: ubrzanje u zadnjim mjerenjima (koherencija ≥ 0,7). Plavo: lokalno trajno slijeganje. Crveno s crnim rubom: nepouzdano (koherencija 0,3–0,5).</dd>' +
    '<dt>SBAS ćelije</dt><dd>U zonama Pehare (Bosna–A1) i km 0 (krug 800 m oko portala tunela Klopče) ćelije Vertikalno / Istok–zapad dolaze iz posebnih SBAS obrada (ćelije 30 m, pikseli γt > 0,7, tamnoplavi rub) umjesto PS ćelija: ' + (M.sbas || []).map(s => s.naziv + ' ' + s.celija + ' ćelija, zadnji mjesec ' + s.zadnji + (s.automatski ? ', automatski se dopunjava novim snimcima' : ', ne osvježava se automatski')).join('; ') + '.</dd>' +
    '<dt>Osvježavanje</dt><dd>Automatski jednom dnevno (novi snimak svakih 6–12 dana po geometriji). Zadnje ažuriranje: ' + M.azurirano + '.</dd>' +
    '<dt>Alati</dt><dd>Klik na tačku: vremenska serija. ◎: prosjek koherentnih tačaka (γ ≥ 0,7, najmanje 3) u krugu 50 m. Ikona slojeva (gore desno): podloge, autocesta sa stacionažom, Bosna, vijadukt, zone klizanja, kuće K, inklinometri. Preuzmi CSV: serija izabrane tačke.</dd>' +
    '<dt>Napomena</dt><dd>Preliminarni rezultati satelitskog mjerenja – nisu službeno upozorenje ni osnov za odluke o objektima bez terenske provjere.</dd></dl>';
  $('info').hidden = false; });
$('info').addEventListener('click', e => { if (e.target.id === 'info' || e.target.classList.contains('zx')) $('info').hidden = true; });
$('x').addEventListener('click', () => { $('sheet').classList.remove('on'); if (selM) { selM.setStyle(st0(selM)); selM = null; } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
// ---- instalacija na početni ekran (iPhone: Dijeli → Dodaj na početni ekran; Android/računar: dugme) ----
(() => {
  const sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; if (sa) return;
  let odb = 0; try { odb = +localStorage.getItem('instOdb') || 0; } catch (e) {}
  if (Date.now() - odb < 14 * 864e5) return;
  const box = $('inst'), zat = () => { box.hidden = true; try { localStorage.setItem('instOdb', String(Date.now())); } catch (e) {} };
  box.querySelector('.zx').addEventListener('click', zat);
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) { $('insttx').textContent = 'Za otvaranje kao aplikacija preko cijelog ekrana: u Safariju dodirni Dijeli (kvadrat sa strelicom) pa „Dodaj na početni ekran“.'; setTimeout(() => box.hidden = false, 2500); return; }
  let ev = null; addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; $('insttx').textContent = 'Dodaj Obilaznica Zenica InSAR na početni ekran – otvara se kao aplikacija, bez adresne trake.'; $('instok').hidden = false; box.hidden = false; });
  $('instok').addEventListener('click', async () => { if (!ev) return; ev.prompt(); await ev.userChoice.catch(() => {}); ev = null; box.hidden = true; });
  addEventListener('appinstalled', () => { box.hidden = true; });
})();
init();
</script>
